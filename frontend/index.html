
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story & Comic Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0b1020;
            color: #eef2ff;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px 60px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 45px;
        }

        h1 {
            margin: 10px 0;
            font-size: clamp(28px, 5vw, 42px);
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            color: transparent;
        }

        header p {
            color: #a5b4fc;
            font-size: 16px;
        }

        .panel {
            background: #151c30;
            border: 1px solid #2b3552;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 12px 35px #00000025;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #dbeafe;
            font-weight: 600;
        }

        textarea, input, select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #35415f;
            border-radius: 10px;
            background: #0e1528;
            color: white;
            font: inherit;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        textarea:focus, input:focus, select:focus {
            border-color: #8b5cf6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .generate-btn {
            width: 100%;
            margin-top: 25px;
            color: white;
            background: linear-gradient(90deg, #7c3aed, #2563eb);
        }

        .copy-btn {
            background: #263653;
            color: #dbeafe;
            padding: 10px 16px;
            font-size: 14px;
        }

        .section-title {
            font-size: 23px;
            margin: 0 0 18px;
        }

        #result {
            display: none;
        }

        .story-title {
            font-size: 32px;
            margin: 0 0 10px;
            color: #c4b5fd;
        }

        .story-meta {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .story-text {
            white-space: pre-wrap;
            line-height: 1.9;
            font-size: 17px;
            color: #e2e8f0;
        }

        .characters-grid, .scenes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .character-card, .scene-card {
            background: #0e1528;
            border: 1px solid #2b3552;
            border-radius: 13px;
            padding: 18px;
        }

        .character-card h3 {
            margin-top: 0;
            color: #93c5fd;
        }

        .scene-number {
            color: #a78bfa;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .scene-description {
            line-height: 1.7;
            color: #e2e8f0;
        }

        .dialogue {
            margin-top: 12px;
            padding: 12px;
            border-left: 3px solid #8b5cf6;
            background: #18213a;
            border-radius: 5px;
            color: #cbd5e1;
            font-style: italic;
        }

        .status {
            margin-top: 18px;
            text-align: center;
            color: #93c5fd;
        }

        .error {
            color: #fca5a5;
            background: #3b1722;
            border: 1px solid #7f1d1d;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            color: #64748b;
            margin-top: 40px;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .panel {
                padding: 18px;
            }

            .story-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">🤖📖</div>
        <h1>AI Story & Comic Generator</h1>
        <p>Turn your imagination into stories and comic scenes.</p>
    </header>

    <section class="panel">
        <h2 class="section-title">✨ Create Your Story</h2>

        <form id="storyForm">

            <label for="storyIdea">Your Story Idea</label>
            <textarea
                id="storyIdea"
                placeholder="Example: A student discovers a mysterious room in his college..."
                required
            ></textarea>

            <div class="form-grid">
                <div>
                    <label for="genre">Choose Genre</label>
                    <select id="genre">
                        <option>Horror</option>
                        <option>Adventure</option>
                        <option>Fantasy</option>
                        <option>Science Fiction</option>
                        <option>Comedy</option>
                        <option>Mystery</option>
                        <option>Romance</option>
                    </select>
                </div>

                <div>
                    <label for="numScenes">Number of Scenes</label>
                    <select id="numScenes">
                        <option value="3">3 Scenes</option>
                        <option value="5" selected>5 Scenes</option>
                        <option value="7">7 Scenes</option>
                        <option value="10">10 Scenes</option>
                    </select>
                </div>
            </div>

            <label for="characters">Character Names</label>
            <input
                id="characters"
                type="text"
                value="Arjun, Maya"
                placeholder="Example: Arjun, Maya"
            >

            <button class="generate-btn" id="generateBtn" type="submit">
                ✨ Generate My Story
            </button>

            <div class="status" id="status" role="status"></div>
        </form>
    </section>

    <div id="errorBox" class="error" hidden></div>

    <section id="result">

        <div class="panel">
            <h2 class="story-title" id="storyTitle"></h2>
            <div class="story-meta" id="storyMeta"></div>

            <button class="copy-btn" id="copyBtn" type="button">
                📋 Copy Story
            </button>

            <h2 class="section-title" style="margin-top: 28px;">
                📖 Complete Story
            </h2>

            <div class="story-text" id="storyText"></div>
        </div>

        <div class="panel">
            <h2 class="section-title">👥 Characters</h2>
            <div class="characters-grid" id="charactersGrid"></div>
        </div>

        <div class="panel">
            <h2 class="section-title">🎬 Story Scenes</h2>
            <div class="scenes-grid" id="scenesGrid"></div>
        </div>

    </section>

    <footer class="footer">
        AI Story & Comic Generator | Powered by Gemini AI
    </footer>

</div>

<script>
    const form = document.getElementById("storyForm");
    const generateBtn = document.getElementById("generateBtn");
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("errorBox");
    const result = document.getElementById("result");

    let currentStory = "";

    function addTextElement(parent, tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text || "";
        parent.appendChild(element);
        return element;
    }

    function displayStory(data) {
        document.getElementById("storyTitle").textContent =
            data.title || "Your Generated Story";

        document.getElementById("storyMeta").textContent =
            (data.genre || "Story") + " • " +
            ((data.scenes || []).length) + " scenes";

        document.getElementById("storyText").textContent =
            data.story || "No story text was returned.";

        const charactersGrid = document.getElementById("charactersGrid");
        charactersGrid.replaceChildren();

        (data.characters || []).forEach(character => {
            const card = document.createElement("div");
            card.className = "character-card";

            addTextElement(
                card,
                "h3",
                "",
                character.name || "Character"
            );

            addTextElement(
                card,
                "p",
                "",
                character.description || "No description provided."
            );

            charactersGrid.appendChild(card);
        });

        const scenesGrid = document.getElementById("scenesGrid");
        scenesGrid.replaceChildren();

        (data.scenes || []).forEach((scene, index) => {
            const card = document.createElement("div");
            card.className = "scene-card";

            addTextElement(
                card,
                "div",
                "scene-number",
                "SCENE " + (scene.scene_number || index + 1)
            );

            addTextElement(
                card,
                "p",
                "scene-description",
                scene.description || "No scene description."
            );

            if (scene.dialogue) {
                addTextElement(
                    card,
                    "div",
                    "dialogue",
                    "“" + scene.dialogue + "”"
                );
            }

            scenesGrid.appendChild(card);
        });

        currentStory = [
            data.title || "Generated Story",
            "",
            data.story || "",
            "",
            "SCENES",
            ...(data.scenes || []).map(scene =>
                "Scene " + scene.scene_number + ": " +
                scene.description +
                (scene.dialogue ? "\nDialogue: " + scene.dialogue : "")
            )
        ].join("\n");

        result.style.display = "block";
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const storyIdea =
            document.getElementById("storyIdea").value.trim();

        const genre =
            document.getElementById("genre").value;

        const numScenes =
            Number(document.getElementById("numScenes").value);

        const charactersText =
            document.getElementById("characters").value.trim();

        const characters = charactersText
            ? charactersText.split(",").map(name => name.trim()).filter(Boolean)
            : [];

        if (!storyIdea) {
            errorBox.textContent = "Please enter a story idea.";
            errorBox.hidden = false;
            return;
        }

        errorBox.hidden = true;
        result.style.display = "none";
        statusBox.textContent = "⏳ Ollama is creating your story...";
        generateBtn.disabled = true;
        generateBtn.textContent = "Generating...";

        try {
            const response = await fetch(
                "https://ai-story-comic-generator-1.onrender.com/generate-story",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"                    },
                    body: JSON.stringify({
                        story_idea: storyIdea,
                        genre: genre,
                        num_scenes: numScenes,
                        characters: characters
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Story generation failed.");
            }

            if (typeof data.story !== "string") {
                throw new Error(
                    "The backend response did not contain a story. " +
                    "Please check the backend output."
                );
            }

            displayStory(data);
            statusBox.textContent = "✅ Your story is ready!";

        } catch (error) {
            errorBox.textContent =
                "Could not generate the story: " + error.message +
                ". Make sure Ollama and your Flask backend are running.";

            errorBox.hidden = false;
            statusBox.textContent = "";
            console.error(error);

        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = "✨ Generate My Story";
        }
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
        if (!currentStory) return;

        try {
            await navigator.clipboard.writeText(currentStory);
            document.getElementById("copyBtn").textContent = "✅ Copied!";
        } catch (error) {
            errorBox.textContent =
                "Copy failed. Please select and copy the story manually.";
            errorBox.hidden = false;
        }
    });
</script>

</body>
</html>
